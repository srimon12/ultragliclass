[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ultragliclass"
version = "0.1.0"
description = "GLiClass uni-encoder on UltraBERT-150M: zero-shot classification and long-context typed decisions (v0.1 recipe, eval and proofs)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Srimon Danguria" }]   # [REVIEW] author / org
keywords = ["gliclass", "zero-shot-classification", "ultrabert", "long-context", "decision-model"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Artificial Intelligence"]
# Pins = the versions every v0.1 training and README-eval run used (proofs/hf_readme_eval/env.json).
# Install torch yourself (CPU or the CUDA build for your GPU); Kaggle images ship their own.
dependencies = [
  "transformers==5.20.2",   # first release with native UltraBERT (no trust_remote_code)
  "gliclass==0.1.21",       # = Knowledgator/GLiClass main @ 6a00f80 (16 Oct 2026)
  "torch>=2.4",
  "pyyaml>=6.0",
  "numpy>=2.0",
]

[project.optional-dependencies]
# data prep, training and evaluation (scripts/prepare_data.py, scripts/train.py, scripts/eval.py)
train = ["datasets>=5.1.0", "accelerate>=1.15.0", "scikit-learn>=1.0", "pyarrow"]
# rebuilding / CPU-testing the Kaggle notebooks
kaggle = ["nbformat", "nbclient"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ultragliclass-predict = "ultragliclass.cli:main"

[project.urls]
Repository = "https://github.com/srimon12/ultragliclass"

[tool.hatch.build.targets.wheel]
packages = ["src/ultragliclass", "src/ugc"]

[tool.ruff]
line-length = 140
extend-exclude = ["notebooks"]

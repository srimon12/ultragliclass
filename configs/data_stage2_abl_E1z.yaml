# Stage-2 ABLATION E1z (generated by scripts/make_ablation_recipes.py from configs/data_stage2_pilot.yaml; do not edit by hand).
# no_procedural=True  semantic_prose_typed=False.  Totals stay 96,035 train / 1,850 val; see STAGE2_ABLATION_JOB_SPEC.md.
name: stage2_abl_E1z
out_dir: data/stage2_abl_E1z
seed: 43
max_options: 50
max_chars: 6000
max_length: 1024
many_label:
  k_min: 20
  k_max: 150
  val_expand_frac: 0.5
forbid_ids:
- banking77
- clinc
- massive
- snips
- financial_phrasebank
- sst5
- sst2
- SetFit/
- imdb
- 20_newsgroups
- enron_spam
- ag_news
- dair-ai/emotion
- cap_sotu
- rotten_tomatoes
sources:
- id: knowledgator/gliclass-v2.0
  format: gliclass
  split: train
  n_train: 58850
  n_val: 400
  license: apache-2.0
  license_note: Hub tag apache-2.0; upstream sources undocumented (DATASETS.md caveat)
  pool: glic-v2
  pool_max_labels: 20000
  pool_min_count: 3
- id: knowledgator/gliclass-v3-logic-dataset
  format: gliclass
  split: train
  n_train: 205
  n_val: 100
  repeat: 3
  license: apache-2.0
- id: tasksource/tasksource-jev-typed-decisions
  config: default
  format: jev
  split: train
  val_split: validation
  n_train: 23500
  n_val: 300
  license_use:
  - commercial
  max_state_chars: 4000
  license: other (filtered to license_use == commercial)
  license_note: per-row license_use == commercial only; that bucket includes CC-BY-SA text (legal check before release, DATASETS.md)
  exclude_source_contains: procedural-typed-decisions/
- id: tasksource/procedural-typed-decisions
  config: all
  format: system_one
  split: train
  val_split: validation
  n_train: 0
  n_val: 300
  max_state_chars: 4000
  license: apache-2.0
- id: DeepPavlov/hwu64
  format: taxonomy
  pool: intents
  split: train
  val_split: test
  n_train: 600
  n_val: 150
  repeat: 3
  text_col: utterance
  label_col: label
  humanize: true
  names:
    from: dataset
    id: DeepPavlov/hwu64
    config: intents
    split: intents
    col: name
  license: cc-by-4.0
  license_note: verified in github.com/xliuhw/NLU-Evaluation-Data README
  eval_overlap: none of the 14 eval sets (clinc150/banking77/massive/snips are different corpora)
- id: coastalcph/lex_glue
  config: ledgar
  format: taxonomy
  pool: legal-clauses
  split: train
  val_split: validation
  n_train: 4160
  n_val: 150
  text_col: text
  label_col: label
  names:
    from: features
  max_chars: 3000
  license: cc-by-4.0
  license_note: LEDGAR (Tuggener et al. 2020) via LexGLUE; CC-BY-4.0 per HF card
  eval_overlap: none
- id: zeroshot/twitter-financial-news-topic
  format: taxonomy
  pool: fin-topics
  split: train
  val_split: validation
  n_train: 1180
  n_val: 150
  repeat: 2
  text_col: text
  label_col: label
  humanize: false
  names:
    list:
    - analyst update
    - fed / central banks
    - company / product news
    - treasuries / corporate debt
    - dividend
    - earnings
    - energy / oil
    - financials
    - currencies
    - general news / opinion
    - gold / metals / materials
    - ipo
    - legal / regulation
    - m&a / investments
    - macro
    - markets
    - politics
    - personnel change
    - stock commentary
    - stock movement
  license: mit
  license_note: MIT per HF card; tweets (platform terms apply; open decision D3)
  eval_overlap: none (different task than financial_phrasebank)
- id: google-research-datasets/go_emotions
  config: simplified
  format: taxonomy
  pool: emotions
  split: train
  val_split: validation
  n_train: 2770
  n_val: 150
  text_col: text
  label_col: labels
  names:
    from: features
  license: apache-2.0
  license_note: Apache-2.0 per HF card; Reddit comments (platform terms, open decision D3)
  eval_overlap: overlaps the emotion eval set in task type only
- id: zeroshot/twitter-financial-news-sentiment
  format: taxonomy
  split: train
  val_split: validation
  n_train: 660
  n_val: 150
  repeat: 3
  text_col: text
  label_col: label
  names:
    list:
    - bearish
    - bullish
    - neutral
  schemes:
  - bearish: negative
    neutral: neutral
    bullish: positive
  - bearish: bearish
    neutral: neutral
    bullish: bullish
  - bearish: negative for the stock
    neutral: no clear impact
    bullish: positive for the stock
  license: mit
  license_note: MIT per HF card; tweets (platform terms, open decision D3)
  eval_overlap: none; financial_phrasebank is CC-BY-NC-SA-3.0 and is NOT used for training
- id: DeveloperOats/DBPedia_Classes
  format: taxonomy
  pool: dbpedia
  enabled: false
  license: cc0-1.0
  disabled_reason: 'D2: excluded by Srimon 23 Oct (CC0 card, CC-BY-SA-3.0 Wikipedia upstream)'
- id: Bitext/Bitext-customer-support-llm-chatbot-training-dataset
  format: taxonomy
  pool: intents
  enabled: false
  license: cdla-sharing-1.0
  disabled_reason: 'D2: excluded by Srimon 23 Oct (CDLA-Sharing-1.0)'
- id: PolyAI/banking77
  format: taxonomy
  pool: intents
  enabled: false
  license: cc-by-4.0
  disabled_reason: eval set (D1)
- id: clinc/clinc_oos
  config: plus
  format: taxonomy
  pool: intents
  enabled: false
  license: cc-by-3.0
  disabled_reason: eval set (D1)

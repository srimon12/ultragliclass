# Stage 2 scale-up mix (~2.4M rows). Only sources with a verified commercial-use licence are enabled.
# New vs the first draft: `taxonomy` sources (intent / topic / class sets that carry a "pool" key so
# ugc.many_label.ManyLabelDataset can expand them to 20-150 labels with hard negatives), fine-grained financial
# sentiment and a label pool over the gliclass-v2.0 vocabulary. See STAGE2_PLAN.md for the reasoning.
name: stage2
out_dir: data/stage2
seed: 43
max_options: 50          # applies to natural rows; taxonomy rows are expanded at train time, not here
max_chars: 6000
max_length: 1024         # only used for the token budget of the static val expansion
many_label:              # static val expansion (train-time expansion is configured in stage2_scale.yaml)
  k_min: 20
  k_max: 150
  val_expand_frac: 0.5
sources:
  # ---- natural-label backbone (unchanged) ------------------------------------------------------------------------
  - {id: knowledgator/gliclass-v2.0, format: gliclass, split: train, n_train: all, n_val: 2000, license: apache-2.0,
     pool: glic-v2, pool_max_labels: 20000, pool_min_count: 5}   # vocabulary pool for noisy expansion (low prob)
  - {id: knowledgator/gliclass-v3-logic-dataset, format: gliclass, split: train, n_train: all, n_val: 300, repeat: 3, license: apache-2.0}
  - {id: tasksource/tasksource-jev-typed-decisions, config: default, format: jev, split: train, val_split: validation,
     n_train: all, n_val: 2000, license_use: [commercial], max_state_chars: 4000, license: "other (filtered to commercial)"}
  - {id: tasksource/procedural-typed-decisions, config: all, format: system_one, split: train, val_split: validation,
     n_train: 300000, n_val: 2000, max_state_chars: 4000, license: apache-2.0}

  # ---- taxonomy sources: many-label training (a) -----------------------------------------------------------------
  # intent pool: HWU64 (64) + Bitext (27) = ~91 labels -> 20-91 label rows (banking77 / clinc-like label counts)
  - {id: DeepPavlov/hwu64, format: taxonomy, pool: intents, split: train, val_split: test, n_train: all, n_val: 300, repeat: 3,
     text_col: utterance, label_col: label, humanize: true,
     names: {from: dataset, id: DeepPavlov/hwu64, config: intents, split: intents, col: name},
     license: cc-by-4.0, license_note: "verified in github.com/xliuhw/NLU-Evaluation-Data README",
     eval_overlap: "none of the 14 eval sets (clinc150/banking77/massive/snips are different corpora)"}
  - {id: Bitext/Bitext-customer-support-llm-chatbot-training-dataset, format: taxonomy, pool: intents, split: train, n_train: 26000, n_val: 300,
     text_col: instruction, label_col: intent, license: cdla-sharing-1.0,
     license_note: "CDLA-Sharing-1.0 (permissive; sharing obligation applies to the data itself). {{placeholder}} tokens kept.",
     eval_overlap: "none"}
  # legal clause types (100 labels)
  - {id: coastalcph/lex_glue, config: ledgar, format: taxonomy, pool: legal-clauses, split: train, val_split: validation, n_train: 60000, n_val: 300,
     text_col: text, label_col: label, names: {from: features}, max_chars: 3000, license: cc-by-4.0,
     license_note: "LEDGAR (Tuggener et al. 2020) via LexGLUE; CC-BY-4.0 per HF card",
     eval_overlap: "none"}
  # DBpedia 219 leaf classes; siblings under the same level-2 parent are the preferred hard negatives
  - {id: DeveloperOats/DBPedia_Classes, format: taxonomy, pool: dbpedia, split: train, val_split: validation, n_train: 120000, n_val: 300,
     text_col: text, label_col: l3, group_col: l2, max_chars: 2500, license: cc0-1.0,
     license_note: "HF card says CC0; the Wikipedia abstracts upstream are CC-BY-SA-3.0 (share-alike). Amber: confirm with counsel.",
     eval_overlap: "none (dbpedia-14 is not in the eval suite)"}
  # financial tweets, 20 topics
  - {id: zeroshot/twitter-financial-news-topic, format: taxonomy, pool: fin-topics, split: train, val_split: validation, n_train: all, n_val: 300, repeat: 2,
     text_col: text, label_col: label, humanize: false,
     names: {list: ["analyst update", "fed / central banks", "company / product news", "treasuries / corporate debt", "dividend",
                    "earnings", "energy / oil", "financials", "currencies", "general news / opinion", "gold / metals / materials",
                    "ipo", "legal / regulation", "m&a / investments", "macro", "markets", "politics", "personnel change",
                    "stock commentary", "stock movement"]},
     license: mit, license_note: "MIT per HF card; tweets (platform terms apply). Amber for redistribution of the text.",
     eval_overlap: "none (different task than financial_phrasebank)"}
  # fine-grained emotion, 28 labels (small pool: expands to 20-28)
  - {id: google-research-datasets/go_emotions, config: simplified, format: taxonomy, pool: emotions, split: train, val_split: validation,
     n_train: 40000, n_val: 300, text_col: text, label_col: labels, names: {from: features}, license: apache-2.0,
     eval_overlap: "overlaps the emotion eval set in task type only"}

  # ---- financial sentiment (d): three label phrasings so the label wording does not matter ----------------------
  - id: zeroshot/twitter-financial-news-sentiment
    format: taxonomy
    split: train
    val_split: validation
    n_train: all
    n_val: 300
    repeat: 3
    text_col: text
    label_col: label
    names: {list: [bearish, bullish, neutral]}
    schemes:
      - {bearish: negative, neutral: neutral, bullish: positive}
      - {bearish: bearish, neutral: neutral, bullish: bullish}
      - {bearish: "negative for the stock", neutral: "no clear impact", bullish: "positive for the stock"}
    license: mit
    license_note: "MIT per HF card; tweets. Training here is the only licensed route to the financial_phrasebank gap."
    eval_overlap: "none; financial_phrasebank is CC-BY-NC-SA-3.0 and is NOT used for training"

  # ---- optional held-in intent sets: OFF by default (they are 3 of the 14 eval sets; see STAGE2_PLAN.md decision D1) --
  - {id: PolyAI/banking77, format: taxonomy, pool: intents, split: train, n_train: all, n_val: 300, text_col: text, label_col: label,
     names: {from: features}, license: cc-by-4.0, enabled: false, eval_overlap: "IS the banking77 eval set (train split)"}
  - {id: clinc/clinc_oos, config: plus, format: taxonomy, pool: intents, split: train, n_train: all, n_val: 300, text_col: text, label_col: intent,
     names: {from: features}, license: cc-by-3.0, enabled: false, eval_overlap: "IS the clinc150 eval set (train split)"}

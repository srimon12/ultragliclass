# Stage-2 ABLATION arm E1 = pilot arm C config (C minus the dedicated procedural dataset (filled with gliclass-v2.0)).
# Everything but the data files and output_dir is inherited from stage2_pilot_C.yaml (many_label on, consistency on, seed 42, 1,500 steps,
# S1 init). Data recipe: configs/data_stage2_abl_E1.yaml.
base: stage2_pilot_C.yaml
data:
  train_files: [data/stage2_abl_E1/train.jsonl]
  val_files: [calib/stage2_pilot_val.jsonl]
  many_label:
    pools_file: data/stage2_abl_E1/label_pools.json
train:
  output_dir: runs/stage2_abl_E1

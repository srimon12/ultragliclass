# Stage-2 PILOT mix: 96,000+ rows = 1,500 steps x 64 (one epoch), identical for arms A / B / C.
# Derived from configs/data_stage2.yaml (23 Oct 2026) with DBpedia and Bitext EXCLUDED (decision D2, Srimon 23 Oct):
#   * natural : taxonomy share is kept at the full recipe's 86.4 % : 13.6 % (2,115,600 : 334,300 rows)
#   * natural sources keep their full-recipe proportions   (gliclass-v2.0 56.7 %, jev 28.4 %, procedural 14.2 %, logic 0.7 %)
#   * taxonomy sources keep their full-recipe proportions among themselves, after dropping DBpedia (120k) and Bitext (26k):
#     HWU64 13.7 %, LEDGAR 31.9 %, fin-topic 18.0 %, GoEmotions 21.2 %, fin-sentiment 15.1 %   -> the dropped weight goes to
#     LEDGAR / GoEmotions / fin-topic / fin-sentiment (many-label diversity), not to HWU64 (its pool is only 64 labels).
# Label pools after the exclusions: intents = HWU64 only (64 labels, so K <= 64 for intent rows), legal-clauses 100 (LEDGAR),
# fin-topics 20, emotions 28, glic-v2 (vocabulary of the sampled gliclass rows, mild expansion K 12-60). Max K for taxonomy rows = 100.
# Eval sets (banking77, clinc150, massive, snips, financial_phrasebank, sst5, ...) are NEVER training sources: guard `forbid_ids`.
name: stage2_pilot
out_dir: data/stage2_pilot
seed: 43
max_options: 50
max_chars: 6000
max_length: 1024
many_label: {k_min: 20, k_max: 150, val_expand_frac: 0.5}
forbid_ids: [banking77, clinc, massive, snips, financial_phrasebank, sst5, sst2, "SetFit/", imdb, 20_newsgroups, enron_spam,
             ag_news, "dair-ai/emotion", cap_sotu, rotten_tomatoes]
sources:
  # ---- natural-label backbone (82,965 rows) -------------------------------------------------------------------------
  - {id: knowledgator/gliclass-v2.0, format: gliclass, split: train, n_train: 47100, n_val: 400, license: apache-2.0,
     license_note: "Hub tag apache-2.0; upstream sources undocumented (DATASETS.md caveat)",
     pool: glic-v2, pool_max_labels: 20000, pool_min_count: 3}     # pilot pool is built from the 47k sampled rows only
  - {id: knowledgator/gliclass-v3-logic-dataset, format: gliclass, split: train, n_train: 205, n_val: 100, repeat: 3, license: apache-2.0}
  - {id: tasksource/tasksource-jev-typed-decisions, config: default, format: jev, split: train, val_split: validation,
     n_train: 23500, n_val: 300, license_use: [commercial], max_state_chars: 4000,
     license: "other (filtered to license_use == commercial)",
     license_note: "per-row license_use == commercial only; that bucket includes CC-BY-SA text (legal check before release, DATASETS.md)"}
  - {id: tasksource/procedural-typed-decisions, config: all, format: system_one, split: train, val_split: validation,
     n_train: 11750, n_val: 300, max_state_chars: 4000, license: apache-2.0}

  # ---- taxonomy sources (13,070 rows): many-label training --------------------------------------------------------------
  # intent pool: HWU64 only (64 labels) once Bitext is out
  - {id: DeepPavlov/hwu64, format: taxonomy, pool: intents, split: train, val_split: test, n_train: 600, n_val: 150, repeat: 3,
     text_col: utterance, label_col: label, humanize: true,
     names: {from: dataset, id: DeepPavlov/hwu64, config: intents, split: intents, col: name},
     license: cc-by-4.0, license_note: "verified in github.com/xliuhw/NLU-Evaluation-Data README",
     eval_overlap: "none of the 14 eval sets (clinc150/banking77/massive/snips are different corpora)"}
  - {id: coastalcph/lex_glue, config: ledgar, format: taxonomy, pool: legal-clauses, split: train, val_split: validation, n_train: 4160, n_val: 150,
     text_col: text, label_col: label, names: {from: features}, max_chars: 3000, license: cc-by-4.0,
     license_note: "LEDGAR (Tuggener et al. 2020) via LexGLUE; CC-BY-4.0 per HF card", eval_overlap: "none"}
  - {id: zeroshot/twitter-financial-news-topic, format: taxonomy, pool: fin-topics, split: train, val_split: validation, n_train: 1180, n_val: 150, repeat: 2,
     text_col: text, label_col: label, humanize: false,
     names: {list: ["analyst update", "fed / central banks", "company / product news", "treasuries / corporate debt", "dividend",
                    "earnings", "energy / oil", "financials", "currencies", "general news / opinion", "gold / metals / materials",
                    "ipo", "legal / regulation", "m&a / investments", "macro", "markets", "politics", "personnel change",
                    "stock commentary", "stock movement"]},
     license: mit, license_note: "MIT per HF card; tweets (platform terms apply; open decision D3)",
     eval_overlap: "none (different task than financial_phrasebank)"}
  - {id: google-research-datasets/go_emotions, config: simplified, format: taxonomy, pool: emotions, split: train, val_split: validation,
     n_train: 2770, n_val: 150, text_col: text, label_col: labels, names: {from: features}, license: apache-2.0,
     license_note: "Apache-2.0 per HF card; Reddit comments (platform terms, open decision D3)",
     eval_overlap: "overlaps the emotion eval set in task type only"}
  - id: zeroshot/twitter-financial-news-sentiment
    format: taxonomy
    split: train
    val_split: validation
    n_train: 660
    n_val: 150
    repeat: 3
    text_col: text
    label_col: label
    names: {list: [bearish, bullish, neutral]}
    schemes:
      - {bearish: negative, neutral: neutral, bullish: positive}
      - {bearish: bearish, neutral: neutral, bullish: bullish}
      - {bearish: "negative for the stock", neutral: "no clear impact", bullish: "positive for the stock"}
    license: mit
    license_note: "MIT per HF card; tweets (platform terms, open decision D3)"
    eval_overlap: "none; financial_phrasebank is CC-BY-NC-SA-3.0 and is NOT used for training"

  # ---- EXCLUDED (listed so the manifest records them; `enabled: false` = never read) -----------------------------------
  - {id: DeveloperOats/DBPedia_Classes, format: taxonomy, pool: dbpedia, enabled: false, license: cc0-1.0,
     disabled_reason: "D2: excluded by Srimon 23 Oct (CC0 card, CC-BY-SA-3.0 Wikipedia upstream)"}
  - {id: Bitext/Bitext-customer-support-llm-chatbot-training-dataset, format: taxonomy, pool: intents, enabled: false, license: cdla-sharing-1.0,
     disabled_reason: "D2: excluded by Srimon 23 Oct (CDLA-Sharing-1.0)"}
  - {id: PolyAI/banking77, format: taxonomy, pool: intents, enabled: false, license: cc-by-4.0, disabled_reason: "eval set (D1)"}
  - {id: clinc/clinc_oos, config: plus, format: taxonomy, pool: intents, enabled: false, license: cc-by-3.0, disabled_reason: "eval set (D1)"}
